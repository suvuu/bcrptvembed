<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BCRP TV embed</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /*
      IMPORTANT:
      BCRP sends a click to the middle of the WebSurface.

      Catch that click HERE instead of allowing it to hit the
      YouTube iframe. That lets us unmute from the click handler.
    */
    #audio-unlock {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: default;
    }

    #msg {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font: 600 18px/1.4 system-ui, sans-serif;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <!--
    Do NOT remove this after the first click.

    BCRP currently sends several autoplay nudges.
    Leaving this over the iframe prevents the later nudges
    from pausing/playing YouTube itself.
  -->
  <button id="audio-unlock" aria-label="Enable TV audio"></button>

  <div id="msg" hidden></div>

  <script>
    const params = new URLSearchParams(location.search);

    const videoId = (params.get('id') || '')
      .replace(/[^A-Za-z0-9_-]/g, '');

    const start = Math.max(
      0,
      parseInt(params.get('start') || '0', 10) || 0
    );

    const wantMuted = params.get('mute') === '1';

    const volume = Math.min(
      100,
      Math.max(
        0,
        parseInt(params.get('volume') ?? '55', 10) || 0
      )
    );

    let player = null;
    let started = false;
    let audioUnlocked = false;

    function fail(text) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.hidden = false;
    }

    function configureIframe() {
      if (!player || !player.getIframe)
        return;

      const iframe = player.getIframe();

      if (!iframe)
        return;

      /*
        YouTube is cross-origin.

        Explicitly delegate autoplay permission to it.
      */
      iframe.setAttribute(
        'allow',
        'autoplay; encrypted-media; picture-in-picture'
      );
    }

    function applyAudio() {
      if (!player)
        return;

      player.setVolume(volume);

      if (wantMuted || volume <= 0) {
        player.mute();
      } else {
        player.unMute();
      }
    }

    /*
      THIS is the important part.

      BCRP's TellMouseButton() hits this button.

      We attempt unmute/play immediately during the click instead
      of clicking YouTube and waiting for a PAUSED callback.
    */
    function unlockAudio() {
      if (!player)
        return;

      audioUnlocked = true;

      configureIframe();
      applyAudio();

      player.playVideo();

      console.log(
        '[BCRP TV] audio unlock:',
        'muted=', player.isMuted(),
        'volume=', player.getVolume()
      );
    }

    document
      .getElementById('audio-unlock')
      .addEventListener('click', unlockAudio);

    if (!videoId) {
      fail('No video id. Expected ?id=VIDEO_ID');
    } else {
      const tag = document.createElement('script');

      tag.src =
        'https://www.youtube.com/iframe_api';

      tag.onerror = () =>
        fail('Could not reach the YouTube player API.');

      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = () => {

      player = new YT.Player('player', {

        videoId,

        playerVars: {
          autoplay: 1,

          /*
            Initial autoplay MUST stay muted.

            The BCRP click will unlock sound afterward.
          */
          mute: 1,

          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1,
          rel: 0,
          start: start,

          origin: location.origin
        },

        events: {

          onReady: (e) => {
            configureIframe();

            e.target.setVolume(volume);
            e.target.mute();

            /*
              Start the picture immediately.

              Muted autoplay is allowed.
            */
            e.target.playVideo();
          },

          onStateChange: (e) => {

            if (e.data === YT.PlayerState.PLAYING) {
              started = true;

              /*
                Only apply requested sound once BCRP has actually
                clicked our unlock layer.
              */
              if (audioUnlocked) {
                applyAudio();
              }

              return;
            }

            if (e.data === YT.PlayerState.ENDED) {
              e.target.seekTo(0, true);
              e.target.playVideo();

              if (audioUnlocked) {
                applyAudio();
              }
            }
          },

          onAutoplayBlocked: () => {
            console.warn(
              '[BCRP TV] Browser blocked an autoplay request'
            );
          },

          onError: (e) => {
            fail('YouTube player error ' + e.data);
          }
        }
      });
    };

    /*
      Some embedded Chromium environments are slow to begin
      muted playback. Retry the VIDEO only.

      Audio unlocking is handled separately by the click above.
    */
    let attempts = 0;

    const retry = setInterval(() => {

      if (
        started ||
        !player ||
        !player.playVideo ||
        ++attempts > 10
      ) {
        if (started || attempts > 10)
          clearInterval(retry);

        return;
      }

      player.playVideo();

    }, 1000);
  </script>

</body>
</html>
